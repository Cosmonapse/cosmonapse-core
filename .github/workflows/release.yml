name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- 1. Python SDK -> PyPI ---------------------------------------------------
  publish-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-sdk
    permissions:
      id-token: write   # needed for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from the git tag, so the full history
          # and tags must be present (the default shallow checkout has neither).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/prism-ui/package-lock.json

      - name: Build Prism UI and copy into the Python package
        working-directory: packages/prism-ui
        run: |
          npm ci || npm install
          # Match the rest of the release: the bundled UI version is the tag.
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm run build:into-wheel   # vite build + copy-dist.mjs -> cosmo/commands/prism_dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build            # version comes from the git tag via hatch-vcs

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist/
          # Uses OIDC trusted publishing - no token secret needed.
          # Set up once at: https://pypi.org/manage/project/cosmonapse/settings/publishing/
          # If you prefer an API token instead, remove the id-token permission above
          # and uncomment the next line:
          # password: ${{ secrets.PYPI_TOKEN }}

  # --- 2. TypeScript SDK -> npm ------------------------------------------------
  publish-npm:
    name: Publish TS SDK to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # needed for OIDC trusted publishing
    defaults:
      run:
        working-directory: packages/ts-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm OIDC trusted publishing needs npm CLI >= 11.5.1; Node 24 ships npm 11.x.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/ts-sdk/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Set version from tag
        # Mirror the Python side: the npm version is the tag, set at publish time
        # rather than committed. `v0.1.1` -> `0.1.1`.
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
