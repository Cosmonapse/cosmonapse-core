[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cosmonapse"
# Version is derived from the git tag at build time (see [tool.hatch.version]).
# Tag a release as `vX.Y.Z` -> the wheel/sdist version is X.Y.Z. No manual edit.
dynamic = ["version"]
description = "Cosmonapse is the open protocol for building distributed multi-agent/model harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "a2a", "protocol", "multi-agent"]
dependencies = [
    # --- core SDK runtime ---
    "pydantic>=2.0",
    "python-ulid>=2.0",
    # --- bundled `cosmo` CLI runtime ---
    # These ship in the core dependency set because `pip install cosmonapse`
    # also installs the `cosmo` command, and the CLI imports them eagerly
    # (rich for output, click for the command tree, aiohttp for `cosmo
    # prism`'s web server).
    "click>=8.1",
    "rich>=13.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Synapse adapters
nats = ["nats-py>=2.3"]
kafka = ["aiokafka>=0.10"]
# Storage backends
postgres = ["asyncpg>=0.29"]
# Receptor interface layer - ApiReceptor / ChatReceptor serve over FastAPI.
# CliReceptor needs nothing beyond the core install.
receptor = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Pinned exactly: ruff's default rule set changes between releases, so an
    # unpinned range makes `ruff check` non-reproducible across dev machines
    # and CI. Bump deliberately, not implicitly.
    "ruff==0.16.0",
    "mypy>=1.9",
    # so the test suite can exercise the optional code paths
    "aiokafka>=0.10",
    "asyncpg>=0.29",
    # so the Receptor HTTP backends are exercised by the suite
    "fastapi>=0.110",
    "httpx>=0.27",
]

# Installing this distribution (`pip install cosmonapse`, or `-e .` for dev)
# puts the `cosmo` command on PATH and makes both `import cosmonapse` and
# `import cosmo` work. The CLI source is now self-contained inside this
# package (./cosmo), so there is no cross-directory build wiring.
[project.scripts]
cosmo = "cosmo.main:cli"
# Helper command to push the active env's Scripts/bin dir onto the user's
# persistent PATH so `cosmo` is callable from any new terminal. The top-level
# installer (cosmonapse-core/install.py) invokes this automatically; users can
# also run it themselves at any time with `cosmonapse-init-path`.
cosmonapse-init-path = "cosmo._install:main"

# ---------------------------------------------------------------------------
# Versioning  -  derived from git tags (hatch-vcs / setuptools-scm)
# ---------------------------------------------------------------------------
# The version comes from the most recent `vX.Y.Z` git tag, so a release is cut
# purely by tagging:  git tag v0.1.1 && git push origin v0.1.1.
# Between tags, builds get a dev version like `0.1.1.dev3+g<sha>`. If no tag is
# reachable (e.g. a shallow CI checkout), it falls back to `fallback_version`.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# `v0.1.1` -> `0.1.1`; the leading `v` is stripped automatically.
fallback_version = "0.1.7"

# ---------------------------------------------------------------------------
# Build configuration
# ---------------------------------------------------------------------------
# This is a single, self-contained distribution that ships two top-level
# import packages: the SDK (`cosmonapse`) and the developer CLI (`cosmo`).
[tool.hatch.build.targets.wheel]
packages = ["cosmonapse", "cosmo"]

[tool.hatch.build.targets.sdist]
include = [
    "cosmonapse",
    "cosmo",
    "README.md",
    "pyproject.toml",
]

# Never ship compiled byte-code caches inside the distribution.
[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "tests",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

# An explicit `select` is required: recent ruff versions enable ~400 rules by
# default, so relying on the default turns every ruff upgrade into a wall of
# new "errors". The set below is the one this codebase is actually written
# against (see the `# noqa:` directives throughout).
[tool.ruff.lint]
select = [
    "F",      # pyflakes  -  real bugs: undefined names, unused imports
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PIE",
    "ISC",    # implicit string concat
    "FURB",   # refurb
    "PYI",    # stub/protocol correctness
    "ASYNC",  # async correctness
    "S",      # bandit
    "BLE",    # blind except
    "TRY",    # tryceratops
    "EXE",
    "ARG",    # unused arguments
    "RUF",
]
ignore = [
    "E501",    # line length: long URLs/SQL/log strings are not worth wrapping
    "TRY003",  # long messages inside raise: these errors are user-facing
    "TRY401",  # redundant exception in logging.exception: we want the value
    "BLE001",  # blind except: deliberate  -  a handler must never kill the loop
    "ARG001",  # unused function argument: protocol/callback signatures are fixed
    "ARG002",  # ...same, for methods
    "ARG003",
    "ARG005",
    "RUF059",  # unused unpacked variable
    "SIM105",  # contextlib.suppress: an explicit try/except reads better here
    "B904",    # raise ... from: not enforced
    "S110",    # try-except-pass: deliberate best-effort cleanup paths
    "S112",    # try-except-continue: ditto
    "N818",    # exception naming: renaming public error classes would break API
    "EXE002",  # shebang/exec-bit: false positive on Windows & OneDrive checkouts
    # Internal invariants ("assert self._pool is not None") that document
    # state rather than validate input. NOTE: these are stripped under
    # `python -O`; converting the storage-layer ones to explicit raises is a
    # worthwhile follow-up.
    "S101",
    # SignalType is `(str, Enum)` on purpose  -  switching to StrEnum would
    # change `str(SignalType.X)` and break wire compatibility.
    "UP042",
    # `asyncio.TimeoutError` is an alias of the builtin only on py3.11+. The
    # rewrite is a no-op on supported versions but silently changes which
    # exception is caught on 3.10, so the explicit form is kept.
    "UP041",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, poke at dunders, and busy-wait on purpose.
"tests/**" = ["S101", "B018", "ASYNC110", "C408", "N806"]
# Win32 API constants are conventionally SCREAMING_CASE.
"cosmo/_install.py" = ["N806"]
# The recall() query is assembled from fixed column names plus $N placeholders
# emitted by the local _p() helper, which binds every caller-supplied value
# through asyncpg. Not an injection vector.
"cosmonapse/engram/postgres.py" = ["S608"]

[tool.mypy]
strict = true

# Optional-dependency imports are checked in two different environments and
# must pass in both: CI installs the extras, a plain `pip install cosmonapse`
# does not. An inline `# type: ignore[import-not-found]` is correct only in the
# second - once the package is present the ignore is dead, and `strict` turns
# on warn_unused_ignores, so the comment that fixed one environment breaks the
# other. Declaring the modules here instead is true in both: mypy stops
# demanding stubs for them and never reports an ignore it did not need.
[[tool.mypy.overrides]]
module = [
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true
